<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support Center</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- BoxIcons for sleek icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Colorful Abstract Liquid Background -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
    <div class="bg-shape shape-4"></div>
    <div class="bg-shape shape-5"></div>

    <div class="container fade-in">
        <div class="header">
            <div class="icon-wrapper">
                <i class='bx bx-support'></i>
            </div>
            <h1>Customer Support</h1>
            <p>We're here to help! Submit your feedback or issue below.</p>
        </div>

        <form id="supportForm">
            <div class="input-group">
                <i class='bx bx-user'></i>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <i class='bx bx-envelope'></i>
                <input type="email" id="email" placeholder="Enter your email address" required>
            </div>

            <div class="input-group textarea-group">
                <i class='bx bx-message-square-detail'></i>
                <textarea id="message" placeholder="Please describe your issue in detail..." required></textarea>
            </div>

            <button type="submit" id="submitBtn">
                <span>Submit Complaint</span>
                <i class='bx bx-send'></i>
            </button>
        </form>

        <div id="responseContainer" class="hidden">
            <i class='bx bx-check-circle'></i>
            <p id="response"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
